<header
  class="navbar shadow-md fixed top-0 left-0 right-0 z-50 px-6 h-16 justify-between transition-colors duration-300 border-b"
  [class.bg-emerald-600]="currentTheme() === 'light'"
  [class.border-emerald-900]="currentTheme() === 'light'"
  [class.bg-slate-900]="currentTheme() === 'dark'"
  [class.border-slate-800]="currentTheme() === 'dark'"
  [class.text-white]="true">

  <div class="flex items-center gap-2">
    <button
      class="btn btn-square btn-ghost text-white"
      [class.hover:bg-emerald-700]="currentTheme() === 'light'"
      [class.hover:bg-slate-800]="currentTheme() === 'dark'"
      (click)="toggleSidebar.emit()"
      aria-label="Alternar Menu">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        class="inline-block w-6 h-6 stroke-current">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <a [routerLink]="['/']" class="text-xl font-bold tracking-wide px-2 cursor-pointer hover:opacity-90 transition-opacity">
      {{ companyName() }}
    </a>
  </div>

  <div class="flex items-center gap-4">
    <!-- Botão de Tema -->
    <label
      class="btn btn-ghost btn-circle text-white swap"
      [class.hover:bg-emerald-700]="currentTheme() === 'light'"
      [class.hover:bg-slate-800]="currentTheme() === 'dark'"
      aria-label="Alternar Tema">
      <input type="checkbox" [checked]="currentTheme() === 'dark'" (change)="toggleTheme.emit()" />

      <svg class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.64,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
      </svg>

      <svg class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M21.64,13.11A1,1,0,0,0,21,13.57A10,10,0,0,1,11.43,2.11a1,1,0,0,0-1.2,1.25,10,10,0,0,0,13.25,13.25,1,1,0,0,0,1.2-1.25Z" />
      </svg>
    </label>

    <!-- Dropdown do Usuário -->
    <div class="dropdown dropdown-end" [class.dropdown-open]="isDropdownOpen()">
      @if (isDropdownOpen()) {
        <div class="fixed inset-0 z-40" (click)="closeDropdown()"></div>
      }

      <button
        type="button"
        class="btn btn-ghost btn-circle avatar placeholder p-0 relative z-50 text-white"
        [class.hover:bg-emerald-700]="currentTheme() === 'light'"
        [class.hover:bg-slate-800]="currentTheme() === 'dark'"
        aria-label="Menu do Usuário"
        (click)="toggleDropdown()">
        <div
          class="rounded-full w-10 h-10 flex items-center justify-center text-white"
          [class.bg-emerald-800]="currentTheme() === 'light'"
          [class.bg-slate-800]="currentTheme() === 'dark'">
          <span class="text-xs">{{ userInitials() }}</span>
        </div>
      </button>

      <ul
        class="mt-3 z-[60] p-2 shadow menu menu-sm dropdown-content bg-base-100 text-base-content rounded-box w-52">
        <li><a class="justify-between" (click)="closeDropdown()">Meu Perfil <span class="badge badge-sm badge-accent">Novo</span></a></li>
        <li><a (click)="closeDropdown()">Configurações de Conta</a></li>
        <li><a class="text-error cursor-pointer" (click)="logout()">Sair</a></li>
      </ul>
    </div>

    <!-- Nome e Cargo -->
    <div class="hidden sm:flex flex-col text-right">
      <span class="text-sm font-semibold leading-tight text-white">{{ userName() }}</span>
      <span
        class="text-xs"
        [class.text-emerald-200]="currentTheme() === 'light'"
        [class.text-slate-400]="currentTheme() === 'dark'">
        {{ userRole() }}
      </span>
    </div>
  </div>
</header>
