<dialog #successDialog class="modal modal-middle" (close)="fechado.emit()">
  <div class="modal-box bg-base-100 text-base-content shadow-2xl border border-base-200 text-center">
    <div class="flex justify-center mb-3">
      <div class="w-12 h-12 rounded-full bg-success/20 flex items-center justify-center text-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
    </div>
    <h3 class="font-bold text-lg text-success">Operação Realizada!</h3>
    <p class="py-2 text-sm text-base-content/80">
      {{ mensagem() }}
    </p>
    <div class="modal-action justify-center mt-4">
      <button type="button" class="btn btn-primary btn-sm px-6" (click)="fechar()">OK</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="button" (click)="fechar()">fechar</button>
  </form>
</dialog>
