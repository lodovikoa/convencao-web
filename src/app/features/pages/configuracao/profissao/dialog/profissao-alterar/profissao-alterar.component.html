<h2 mat-dialog-title>Alterar Profissão</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="flex-column" style="display: flex; flex-direction: column; gap: 30px; padding-top: 10px;">

    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <input matInput
             formControlName="dsDescricao"
             placeholder="Ex: Engenheiro" >
      @if (form.get('dsDescricao')?.invalid && form.get('dsDescricao')?.touched) {
        <mat-error>Descrição é de preenchimento obrigatório com no máximo 150 caracteres.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>CBO</mat-label>
      <input matInput
             formControlName="dsCBO"
             mask="0000-00"
             placeholder="Ex: 1111-10">
      @if (form.get('dsCBO')?.invalid && form.get('dsCBO')?.touched) {
        <mat-error>CBO se preenchido deve ter 6 caracteres.</mat-error>
      }
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button
          color="primary"
          [disabled]="form.invalid || form.pristine || isLoading()"
          (click)="onSave()">
      @if(isLoading()) {
        <mat-spinner diameter="20" style="display: inline-block;"></mat-spinner>
      } @else {
        Salvar
      }
  </button>
</mat-dialog-actions>
