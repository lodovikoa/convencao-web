<h2 mat-dialog-title>Cadastrar Departamento</h2>

<mat-dialog-content>
  <form [formGroup]="form" style="padding-top: 10px;">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome Reduzido</mat-label>
      <input matInput formControlName="dsReduzido">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome do Departamento</mat-label>
      <input matInput formControlName="dsDepartamento">
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Convenção</mat-label>
        <mat-select formControlName="convencaoId">
          <mat-option [value]="null">Selecione uma convenção</mat-option>
          @for (convencao of convencaos(); track convencao.id) {
            <mat-option [value]="convencao.id">
              {{ convencao.dsReduzido }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button
      color="primary"
      [disabled]="form.invalid || isLoading()"
      (click)="onSave()">
    @if(isLoading()) {
      <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
    } @else {
      Gravar
    }
  </button>
</mat-dialog-actions>
