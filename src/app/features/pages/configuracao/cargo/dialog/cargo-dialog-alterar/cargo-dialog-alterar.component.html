<h2 mat-dialog-title>Alterar Cargo</h2>

<mat-dialog-content>
   <form [formGroup]="form" class="flex-column" style="display: flex; flex-direction: column; gap: 10px; padding-top: 10px;">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cargo</mat-label>
      <input matInput formControlName="dsCargo">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Titulo</mat-label>
      <input matInput formControlName="dsTitulo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Convenção</mat-label>
      <mat-select formControlName="convencao" [compareWith]="compararConvencao">
        <mat-option [value]="null">Selecione uma Convenção</mat-option>
        @for (convencao of convencaos(); track convencao.id) {
        <mat-option [value]="convencao">{{ convencao.dsReduzido }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button
      mat-raised-button
      color="primary"
      [disabled]="form.invalid || !form.dirty || isLoading()"
      (click)="onSave()">
    @if(isLoading()) {
    <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
      Salvar
    } @else {
    Salvar
    }
  </button>
</mat-dialog-actions>
