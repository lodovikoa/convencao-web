<div class="header-container">
  <h2>Cadastro de Cargos</h2>
  <button mat-raised-button color="primary" (click)="cadastrar()">
    <mat-icon>add</mat-icon> Cadastrar Cargo
  </button>
</div>

<div class="container mat-elevation-z4">

  @if(isLoading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  }

  <table mat-table [dataSource]="datasource" >

    <ng-container matColumnDef="dsCargo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Cargo </th>
      <td mat-cell *matCellDef="let element"> {{element.dsCargo}} </td>
    </ng-container>

    <ng-container matColumnDef="dsTitulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Título </th>
      <td mat-cell *matCellDef="let element"> {{element.dsTitulo}} </td>
    </ng-container>

    <ng-container matColumnDef="convencao.dsReduzido">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Convenção </th>
      <td mat-cell *matCellDef="let element"> {{element.convencao?.dsReduzido}} </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> Ações </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="editar(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="excluir(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
