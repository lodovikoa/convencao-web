<div class="flex flex-col gap-3 p-6">
  <h2 class="text-2xl font-bold text-base-content m-0">Cadastro de Convenções</h2>

  <div class="card bg-base-100 text-base-content shadow-xl relative overflow-hidden">
    <div class="flex flex-col sm:flex-row justify-between items-center p-4 border-b border-base-200 gap-4">
      @if(temPermissaoCadastrar()) {
        <button class="btn btn-primary gap-2" (click)="cadastrar()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Cadastrar Convenção
        </button>
      }

      <span class="text-sm text-base-content/70 ml-auto">
        Total de <strong class="text-base-content">{{ convencaoList().length }}</strong> registros
      </span>
    </div>
      @if (isLoading()) {
        <div class="absolute inset-0 bg-base-100/50 backdrop-blur-xs flex items-center justify-center z-10">
          <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
      }

      <div class="overflow-x-auto">
        <table class="table table-zebra text-base-content">
          <thead>
             <tr class="text-base-content">
              <th class="cursor-pointer hover:bg-base-200">Nome reduzido</th>
              <th class="cursor-pointer hover:bg-base-200" >Convenção</th>
            </tr>
          </thead>
          <tbody>
            @for (item of convencaoList(); track item.id) {
              <tr>
                <td>
                  <a class="link link-primary font-semibold cursor-pointer" (click)="detalhar(item)">
                    {{ item.dsReduzido }}
                  </a>
                </td>
                <td class="text-base-content">{{ item.dsConvencao }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="2" class="text-center py-4 text-base-content/60">Nenhuma convenção encontrada.</td>
              </tr>
            }
          </tbody>
        </table>

    </div>
  </div>
</div>

<!-- Modal DaisyUI para Cadastro -->
<dialog #cadastrarDialog class="modal modal-middle">
  <div class="modal-box bg-base-100 p-0 shadow-2xl border border-base-200">
    <app-convencao-dialog-cadastrar (fechar)="fecharCadastrarDialog($event.salvo, $event.nomeConvencao)" />
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="button" (click)="fecharCadastrarDialog(false)">fechar</button>
  </form>
</dialog>
