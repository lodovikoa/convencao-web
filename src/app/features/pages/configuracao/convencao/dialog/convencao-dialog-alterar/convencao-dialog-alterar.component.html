<h2 mat-dialog-title>Alterar Convenção</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="grid-form">

    <mat-form-field appearance="outline">
      <mat-label>Nome Reduzido</mat-label>
      <input matInput formControlName="dsReduzido">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>CNPJ</mat-label>
      <input matInput formControlName="dsCnpj" mask="00.000.000/0000-00" placeholder="__.___.___/____-__", [dropSpecialCharacters]="true">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" style="grid-column: span 2;">
      <mat-label>Nome da Convenção</mat-label>
      <input matInput formControlName="dsConvencao">
    </mat-form-field>


    <mat-form-field appearance="outline" class="full-width" style="grid-column: span 2;">
      <mat-label>E-mail</mat-label>
      <input matInput formControlName="dsEmail">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefone1</mat-label>
      <input matInput formControlName="dsTelefone1" mask="(00) 00000-0000" placeholder="(__) _____-____", [dropSpecialCharacters]="true">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefone2</mat-label>
      <input matInput formControlName="dsTelefone2" mask="(00) 00000-0000" placeholder="(__) _____-____", [dropSpecialCharacters]="true">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefone3</mat-label>
      <input matInput formControlName="dsTelefone3" mask="(00) 00000-0000" placeholder="(__) _____-____", [dropSpecialCharacters]="true">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>WhatsApp</mat-label>
      <input matInput formControlName="dsWatsapp" mask="(00) 00000-0000" placeholder="(__) _____-____", [dropSpecialCharacters]="true">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" style="grid-column: span 2;">
      <mat-label>Endereço</mat-label>
      <input matInput formControlName="dsEndereco">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" style="grid-column: span 2;">
      <mat-label>Bairro</mat-label>
      <input matInput formControlName="dsBairro">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" style="grid-column: span 2;">
      <mat-label>Cidade</mat-label>
      <input matInput formControlName="dsCidade">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="estado" [compareWith]="compararEstados">
        <mat-option [value]="null">Selecione um estado</mat-option>
        @for (estado of estados(); track estado.id) {
          <mat-option [value]="estado">{{ estado.dsUf }} - {{ estado.dsNome }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>CEP</mat-label>
      <input matInput formControlName="dsCep" mask="00000-000" placeholder="_____-___", [dropSpecialCharacters]="true">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" style="grid-column: span 2;">
      <mat-label>País</mat-label>
      <input matInput formControlName="dsPais">
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button
      color="primary"
      [disabled]="form.invalid || isLoading()"
      (click)="onSave()">
      @if(isLoading()) {
        <mat-spinner diameter="20" style="display: inline-block;"></mat-spinner>
      } @else {
        Salvar
      }
  </button>
</mat-dialog-actions>
