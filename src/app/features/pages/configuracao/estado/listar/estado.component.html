<div class="header-container">
  <h2>Cadastro de Estados</h2>
  <button *appHasPermission="'T_CFT_MASTER'" mat-raised-button color="primary" (click)="cadastrarEstado()">
    <mat-icon>add</mat-icon> Cadastrar Estado
  </button>
</div>

<div class="container mat-elevation-z4">

  @if(isLoading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  }

  <table mat-table [dataSource]="datasource" matSort (matSortChange)="ordenar($event)">

    <ng-container matColumnDef="dsUf">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> UF </th>
      <td mat-cell *matCellDef="let element"> {{element.dsUf}} </td>
    </ng-container>

    <ng-container matColumnDef="dsNome">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
      <td mat-cell *matCellDef="let element"> {{element.dsNome}} </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> Ações </th>
      <td mat-cell *matCellDef="let element">
        <button  *appHasPermission="'T_CFT_MASTER'" mat-icon-button color="primary" (click)="editar(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button  *appHasPermission="'T_CFT_MASTER'" mat-icon-button color="warn" (click)="excluir(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  <mat-paginator
    [length]="estadosResponse()?.pageable?.elementsTotal || 0"
    [pageSize]="estadosResponse()?.pageable?.pageSize || 10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="mudouPagina($event)"
    showFirstLastButtons  />
</div>
