<dialog #modalCadastro class="modal modal-bottom sm:modal-middle">
  <div class="modal-box bg-base-100 text-base-content border border-base-200 shadow-2xl max-w-lg">

    <!-- Cabeçalho do Modal -->
    <div class="flex justify-between items-center pb-4 mb-4 border-b border-base-200">
      <h3 class="font-bold text-lg text-base-content">Cadastrar Nova Cidade</h3>
      <button type="button" class="btn btn-sm btn-circle btn-ghost" (click)="fechar()">✕</button>
    </div>

    <!-- Formulário -->
    <form (submit)="salvar($event)" class="space-y-4">

      <!-- Nome da Cidade (IBGE) -->
      <div class="form-control">
        <label for="cad-dsNomeIbge" class="label"><span class="label-text font-semibold">Nome da Cidade (IBGE) *</span></label>
        <input
          id="cad-dsNomeIbge"
          type="text"
          placeholder="Ex: Cariacica"
          maxlength="50"
          class="input input-bordered w-full bg-base-100 text-base-content"
          [value]="dsNomeIbge()"
          (input)="atualizarNomeIbge($any($event.target).value)"
          required
          autocomplete="off"
        />
        <label class="label">
          <span class="label-text-alt text-base-content/60">{{ dsNomeIbge().length }}/50 caracteres</span>
        </label>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Código IBGE -->
        <div class="form-control">
          <label for="cad-cdIbge" class="label"><span class="label-text font-semibold">Código IBGE *</span></label>
          <input
            id="cad-cdIbge"
            type="text"
            placeholder="Ex: 3201308"
            maxlength="7"
            class="input input-bordered w-full bg-base-100 text-base-content font-mono"
            [value]="cdIbge()"
            (input)="atualizarIbge($any($event.target).value)"
            required
            autocomplete="off"
          />
          <label class="label">
            <span class="label-text-alt text-base-content/60">Máx. 7 dígitos numéricos</span>
          </label>
        </div>

        <!-- Combobox de UF do Estado -->
        <div class="form-control">
          <label for="cad-estadoUf" class="label"><span class="label-text font-semibold">Estado (UF) *</span></label>
          <select
            id="cad-estadoUf"
            class="select select-bordered w-full bg-base-100 text-base-content font-medium"
            [value]="estadoUf()"
            (input)="estadoUf.set($any($event.target).value)"
            required>
            <option value="" disabled selected>Selecione o estado...</option>
            @for (est of estados(); track est.id) {
              <option [value]="est.dsUf">{{ est.dsUf }} - {{ est.dsNome }}</option>
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Nome TOM -->
        <div class="form-control">
          <label for="cad-dsNomeTom" class="label"><span class="label-text font-semibold">Nome TOM (Opcional)</span></label>
          <input
            id="cad-dsNomeTom"
            type="text"
            placeholder="Nome TOM"
            maxlength="50"
            class="input input-bordered w-full bg-base-100 text-base-content"
            [value]="dsNomeTom()"
            (input)="atualizarNomeTom($any($event.target).value)"
            autocomplete="off"
          />
          <label class="label">
            <span class="label-text-alt text-base-content/60">{{ dsNomeTom().length }}/50 caracteres</span>
          </label>
        </div>

        <!-- Código TOM -->
        <div class="form-control">
          <label for="cad-cdTom" class="label"><span class="label-text font-semibold">Código TOM (Opcional)</span></label>
          <input
            id="cad-cdTom"
            type="text"
            placeholder="Código TOM"
            maxlength="5"
            class="input input-bordered w-full bg-base-100 text-base-content font-mono"
            [value]="cdTom()"
            (input)="atualizarTom($any($event.target).value)"
            autocomplete="off"
          />
          <label class="label">
            <span class="label-text-alt text-base-content/60">Máx. 5 dígitos numéricos</span>
          </label>
        </div>
      </div>

      <!-- Rodapé / Ações -->
      <div class="modal-action pt-4 border-t border-base-200">
        <button type="button" class="btn btn-ghost" (click)="fechar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="salvando()">
          @if (salvando()) {
            <span class="loading loading-spinner loading-xs"></span>
            Salvando...
          } @else {
            Cadastrar
          }
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="button" (click)="fechar()">fechar</button>
  </form>
</dialog>

<!-- Modal DaisyUI de Erro Interno (Mantém o modal de cadastro aberto ao fechar) -->
<dialog #errorDialog class="modal modal-middle z-50">
  <div class="modal-box bg-base-100 text-base-content shadow-2xl border border-base-200 text-center">
    <div class="flex justify-center mb-3">
      <div class="w-12 h-12 rounded-full bg-error/20 flex items-center justify-center text-error">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
    </div>
    <h3 class="font-bold text-lg text-error">Atenção!</h3>
    <p class="py-2 text-sm text-base-content/80 whitespace-pre-line">
      {{ errorMessageModal() }}
    </p>
    <div class="modal-action justify-center mt-4">
      <button type="button" class="btn btn-error btn-sm px-6" (click)="fecharModalErro()">OK</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="button" (click)="fecharModalErro()">fechar</button>
  </form>
</dialog>
