<dialog #modalCadastro class="modal modal-bottom sm:modal-middle">
  <div class="modal-box bg-base-100 text-base-content border border-base-200 shadow-2xl max-w-lg">

    <!-- Cabeçalho do Modal -->
    <div class="flex justify-between items-center pb-4 mb-4 border-b border-base-200">
      <h3 class="font-bold text-lg text-base-content">Cadastrar Nova Cidade</h3>
      <button type="button" class="btn btn-sm btn-circle btn-ghost" (click)="fechar()">✕</button>
    </div>

    <!-- Formulário Reativo -->
    <form [formGroup]="form" (ngSubmit)="salvar($event)" class="space-y-4">

      <!-- Linha 1: Nome da Cidade (IBGE) e Código IBGE -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <!-- Nome da Cidade (IBGE) - Ocupa 2 colunas -->
        <div class="form-control sm:col-span-2">
          <label for="cad-dsNomeIbge" class="label"><span class="label-text font-semibold">Nome da Cidade (IBGE) *</span></label>
          <input
            id="cad-dsNomeIbge"
            type="text"
            placeholder="Ex: Cariacica"
            maxlength="50"
            class="input input-bordered w-full bg-base-100 text-base-content"
            formControlName="dsNomeIbge"
            (input)="aplicarMascaraTexto('dsNomeIbge', 50, $event)"
            autocomplete="off"/>
          <label class="label">
            <span class="label-text-alt text-base-content/60">
              {{ form.get('dsNomeIbge')?.value?.length || 0 }}/50 caracteres
            </span>
          </label>
        </div>

        <!-- Código IBGE - Ocupa 1 coluna -->
        <div class="form-control sm:col-span-1">
          <label for="cad-cdIbge" class="label"><span class="label-text font-semibold">Cód. IBGE *</span></label>
          <input
            id="cad-cdIbge"
            type="text"
            placeholder="Ex: 3201308"
            maxlength="7"
            class="input input-bordered w-full bg-base-100 text-base-content font-mono"
            formControlName="cdIbge"
            (input)="aplicarMascaraNumeros('cdIbge', 7, $event)"
            autocomplete="off"
          />
          <label class="label">
            <span class="label-text-alt text-base-content/60">Máx. 7 dígitos</span>
          </label>
        </div>
      </div>

      <!-- Linha 2: Nome TOM e Código TOM -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <!-- Nome TOM - Ocupa 2 colunas -->
        <div class="form-control sm:col-span-2">
          <label for="cad-dsNomeTom" class="label"><span class="label-text font-semibold">Nome TOM (Opcional)</span></label>
          <input
            id="cad-dsNomeTom"
            type="text"
            placeholder="Nome TOM"
            maxlength="50"
            class="input input-bordered w-full bg-base-100 text-base-content"
            formControlName="dsNomeTom"
            (input)="aplicarMascaraTexto('dsNomeTom', 50, $event)"
            autocomplete="off"
          />
          <label class="label">
            <span class="label-text-alt text-base-content/60">
              {{ form.get('dsNomeTom')?.value?.length || 0 }}/50 caracteres
            </span>
          </label>
        </div>

        <!-- Código TOM - Ocupa 1 coluna -->
        <div class="form-control sm:col-span-1">
          <label for="cad-cdTom" class="label"><span class="label-text font-semibold">Cód. TOM</span></label>
          <input
            id="cad-cdTom"
            type="text"
            placeholder="Cód. TOM"
            maxlength="5"
            class="input input-bordered w-full bg-base-100 text-base-content font-mono"
            formControlName="cdTom"
            (input)="aplicarMascaraNumeros('cdTom', 5, $event)"
            autocomplete="off"
          />
          <label class="label">
            <span class="label-text-alt text-base-content/60">Máx. 5 dígitos</span>
          </label>
        </div>
      </div>

      <!-- Linha 3: Estado (UF) em largura total -->
      <div class="form-control">
        <label for="cad-estadoUf" class="label"><span class="label-text font-semibold">Estado (UF) *</span></label>
        <select
          id="cad-estadoUf"
          class="select select-bordered w-full bg-base-100 text-base-content font-medium"
          formControlName="estadoUf">
          <option value="" disabled selected>Selecione o estado...</option>
          @for (est of estados(); track est.id) {
            <option [value]="est.dsUf">{{ est.dsUf }} - {{ est.dsNome }}</option>
          }
        </select>
      </div>

      <!-- Rodapé / Ações -->
      <div class="modal-action pt-4 border-t border-base-200">
        <button type="button" class="btn btn-ghost" (click)="fechar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || salvando()">
          @if (salvando()) {
            <span class="loading loading-spinner loading-xs"></span>
            Salvando...
          } @else {
            Cadastrar
          }
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="button" (click)="fechar()">fechar</button>
  </form>
</dialog>
